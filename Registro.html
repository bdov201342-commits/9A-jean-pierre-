<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gamer Zone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .titulo {
            color: #39ff14;
            font-size: 48px;
            letter-spacing: 6px;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.8), 0 0 40px rgba(57, 255, 20, 0.5);
            animation: parpadeo 2s infinite;
            margin-bottom: 10px;
        }

        .subtitulo {
            color: #7FFF00;
            font-size: 15px;
            letter-spacing: 3px;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        @keyframes parpadeo {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .contenedor {
            background: transparent;
            border: 2px solid #39ff14;
            border-radius: 8px;
            padding: 30px 40px;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.6), inset 0 0 15px rgba(57, 255, 20, 0.15);
            width: 320px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #39ff14;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            color: #39ff14;
            background: transparent;
            border: 2px solid #39ff14;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            letter-spacing: 2px;
            outline: none;
            box-shadow: inset 0 0 8px rgba(57, 255, 20, 0.2);
        }

        input:focus {
            box-shadow: 0 0 12px rgba(57, 255, 20, 0.8), inset 0 0 8px rgba(57, 255, 20, 0.3);
        }

        .boton {
            width: 100%;
            padding: 14px;
            color: #fff;
            background: transparent;
            border: 2px solid #39ff14;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .boton:hover {
            background: #39ff14;
            color: #000;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.9);
        }

        .boton:active {
            transform: scale(0.95);
        }

        .error {
            color: #ff4444;
            font-size: 13px;
            letter-spacing: 1px;
            margin-top: 15px;
            min-height: 18px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 class="titulo">GAMER ZONE</h1>
    <p class="subtitulo">>> registrate para entrar <<</p>

    <div class="contenedor">
        <form id="form-registro">
            <div class="campo">
                <label for="nombre">Nombre de Usuario:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button class="boton" type="submit">Entrar</button>
            <p class="error" id="mensaje-error"></p>
        </form>
    </div>

    <script>
        document.getElementById('form-registro').addEventListener('submit', function (e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const password = document.getElementById('password').value;
            const error = document.getElementById('mensaje-error');

            if (!nombre) {
                error.textContent = 'ESCRIBE TU NOMBRE';
                return;
            }

            if (password !== 'Picsi2026') {
                error.textContent = 'CONTRASEÑA INCORRECTA';
                return;
            }

            error.textContent = '';
            window.location.href = 'menu.html';
        });
    </script>
</body>
</html>
